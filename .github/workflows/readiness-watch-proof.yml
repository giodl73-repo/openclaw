name: Readiness watch Docker proof

on:
  workflow_dispatch:
  push:
    branches:
      - user/giodl/readiness-operations-proof

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Verify immutable implementation parent
        shell: bash
        run: |
          set -euo pipefail
          expected=3d59eebb8ea292caab13b4216e47a60558849852
          actual="$(git rev-parse HEAD^)"
          test "$actual" = "$expected"
          printf 'READINESS_WATCH_IMPLEMENTATION_SHA=%s\n' "$actual" | tee -a "$GITHUB_ENV"

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          install-bun: "false"

      - name: Run readiness RPC regression tests
        shell: bash
        run: >-
          pnpm exec vitest run
          src/gateway/server-startup-plugin-quarantine.test.ts
          src/gateway/server-methods/health.readiness.test.ts

      - name: Run package-installed Docker proof
        shell: bash
        run: bash .readiness-watch-proof.sh

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: readiness-watch-proof-${{ github.run_attempt }}
          path: artifacts/readiness-watch-proof/
          if-no-files-found: warn
          retention-days: 14
