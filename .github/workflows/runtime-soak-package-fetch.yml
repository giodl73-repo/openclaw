name: Runtime Soak Package Fetch

on:
  push:
    branches:
      - user/giodl/runtime-soak-package-build

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download and verify OpenClaw package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output openclaw-2026.9.4.tgz \
            https://registry.npmjs.org/openclaw/-/openclaw-2026.9.4.tgz
          echo "4f1f656770461d4677dea755b1899cba12b912b06798c89a59e2f0c18688b761  openclaw-2026.9.4.tgz" |
            sha256sum --check --strict
          actual_integrity="$(
            openssl dgst -sha512 -binary openclaw-2026.9.4.tgz |
              openssl base64 -A
          )"
          test "$actual_integrity" = \
            "lTQpEEe1Xm3u2PCHaPEr+vP8paGk1vLdHuzdItsNToaLI6hAqRVvgJYg+GxukJhETJp4tPy/S1Gftl4KuB8n7A=="
      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-2026.9.4-npm-tarball
          path: openclaw-2026.9.4.tgz
          if-no-files-found: error
          retention-days: 1

  build-exact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact Responses-fix source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0a8d8b616033fc88c61263fb5130dfe9ca8799bb
          persist-credentials: false
      - name: Setup locked Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: 24.19.0
          install-bun: "true"
          install-deps: "true"
          frozen-lockfile: "true"
          cache-mode: "off"
      - name: Build exact source
        env:
          OPENCLAW_CONTROL_UI_RELEASE_BUILD: "1"
        run: pnpm build
      - name: Pack exact source
        shell: bash
        run: |
          set -euo pipefail
          output="$PWD/runtime-package"
          mkdir -p "$output"
          export OPENCLAW_PREPACK_PREPARED=1
          pnpm --dir packages/ai pack --pack-destination "$output"
          pnpm --dir packages/session-url-contract pack --pack-destination "$output"
          pnpm --dir . pack --pack-destination "$output"
          test "$(find runtime-package -maxdepth 1 -name '*.tgz' | wc -l)" -eq 3
          for package in runtime-package/*.tgz; do
            if tar -xOf "$package" package/package.json | grep -q 'workspace:'; then
              echo "Unresolved workspace dependency in $package" >&2
              exit 1
            fi
          done
          sha256sum runtime-package/*.tgz | tee runtime-package/SHA256SUMS
          printf '%s\n' \
            'source=0a8d8b616033fc88c61263fb5130dfe9ca8799bb' \
            'node=24.19.0' \
            'packageManager=pnpm@12.3.4' \
            > runtime-package/BUILD-IDENTITY.txt
      - name: Upload exact source package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-0a8d8b6-source-package
          path: runtime-package
          if-no-files-found: error
          retention-days: 1
